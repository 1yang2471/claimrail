name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# 真网络用例设计上默认跳过（FK_NET=1 才外发），CI 不设 FK_NET——门禁语义与本地一致。
# browser/color 两层吃本地 fixture 页面，不依赖外网；装好 chromium 即全量跑。
jobs:
  test:
    strategy:
      fail-fast: false
      # 互补矩阵：两个 OS、两条在维护的 Node LTS 线，各测一次，不做冗余组合
      matrix:
        include:
          - os: ubuntu-latest
            node-version: 22
          - os: windows-latest
            node-version: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 安装 chromium（browser/color 测试层要用）
        if: matrix.os == 'ubuntu-latest'
        run: npx playwright install --with-deps chromium

      - name: 安装 chromium（browser/color 测试层要用）
        if: matrix.os == 'windows-latest'
        run: npx playwright install chromium

      - name: 运行测试
        run: npm test
